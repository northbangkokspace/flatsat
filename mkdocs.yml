site_name: Flatsat Documentation
hooks:
  - hooks.py
extra_css:
  - stylesheets/extra.css
theme:
  name: material
  logo: assets/nb_logo_w.png
  font:
    text: Inter
    code: Roboto Mono
  palette: 
    - scheme: default # Light mode
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate # Dark mode
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
# repo_url: https://openfruit.space
site_author: NBSpace
site_url: https://flatsat.kidorbit.space
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
  - d2
  - drawio
nav:
  - Home: index.md
  - Subsystems:
      - On-board Computer (OBC): subsystems/obc.md
      - Electrical Power System (EPS): subsystems/eps.md
      - Communication System (COMMS): subsystems/communication.md
      - Payload: subsystems/payload.md
      - Ground Station: subsystems/ground-segment.md
  - Measurements: measurements_point.md